name: Deploy Angular to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543704476224:role/github-actions-deploy-diff-checker
          aws-region: ap-southeast-1

      - name: Deploy to S3
        run: aws s3 sync dist/devkit-diff-checker-web/browser s3://diff-checker.20baht.com --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2VIUBQM2UK4SF --paths "/*"
